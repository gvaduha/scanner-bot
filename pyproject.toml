[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-bot"
version = "0.1.0"
description = "Telegram bot that scans groups and replies on vocabulary or Claude decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
scanner-bot = "scanner_bot.__main__:main"

[tool.setuptools]
packages = ["scanner_bot"]
